name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: "ubuntu-latest" migrates to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle itself, so no gradle-wrapper.jar needs to be committed.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Unit tests + debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
